<!DOCTYPE html>
<html>

<head>
    <title>Superhero Power Cards</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4ff;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: blue;
        }

        p {
            color: black;
        }

        button {
            background-color: blue;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .hero-card {
            background-color: white;
            border: 3px solid blue;
            border-radius: 12px;
            width: 220px;
            padding: 18px;
        }

        .hero-name {
            font-size: 22px;
            font-weight: bold;
            color: #222222;
        }

        .hero-power {
            color: darkred;
            font-weight: bold;
        }

        .hero-mission {
            color: #666666;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>My Superhero Power Cards</h1>

    <p>
        Click the button to create superhero objects using JavaScript classes.
    </p>

    <button onclick="showHeroes()">Show Superheroes</button>

    <div class="card-container" id="heroCards"></div>

    <script>

        class Superhero {

           
            constructor(name, power, mission) {

                this.name = name;
                this.power = power;
                this.mission = mission;
            }

            describeHero() {
                return "<div class='hero-card'>" +
                    "<p class='hero-name'>" + this.name + "</p>" +
                    "<p class='hero-power'>Power: " + this.power + "</p>" +
                    "<p class='hero-mission'>Mission: " + this.mission + "</p>" +
                    "</div>";
            }
        }

        function showHeroes() {

            let hero1 = new Superhero(
                "Voidstrider",
                "Create some small pocket worlds/dimensions",
                "Give everyone a safe and unique world to boost their imagination and creativity."
            );

            let hero2 = new Superhero(
                "Shadowbound",
                "Control shadows and darkness",
                "Remove any evil spirits in people's shadows."
            );

            let hero3 = new Superhero(
                "Oddsbreaker",
                "Manipulate the chance of something happening",
                "Help people in need with their luck and reward them some money to live."
            );

            let hero4 = new Superhero(
                "Null Second",
                "Freeze time",
                "Freeze time when kind people are in danger and help them out."
            );

            document.getElementById("heroCards").innerHTML =
                hero1.describeHero() +
                hero2.describeHero() +
                hero3.describeHero() +
                hero4.describeHero();
        }
    </script>

</body>

</html>
