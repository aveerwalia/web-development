<html>
    <head>
        <title>
            Digital Clock
        </title>

        <style>
            body{
                text-align: center;
                font-family: 'Times New Roman', Times, serif;
                color: aquamarine;
                background-image: linear-gradient(to bottom, navy, blue, aqua, white, aqua, blue, navy);
            }

            #MyClockDisplay{
                font-size:35px;
                text-align: center;
                
            }


        </style>
    </head>

    <body>
        <h1>
            Digital Clock
        </h1>

        <div id="MyClockDisplay"  onload="ShowTime()"></div><b></b>  

        <script>
            function showTime() {
                var date = new Date();
                var h = date.getHours();
                var m = date.getMinutes();
                var s = date.getSeconds();
                var session = "AM";

                if(h > 12){
                    h = h - 12;
                    session = "PM"
                }

                h = (h < 10) ? "0" + h : h;
                m = (m < 10) ? "0" + m : m;
                s = (s < 10) ?"0" + s : s;

                var time = h + ":" + m + ":" + s + " " + session;
                document.getElementById("MyClockDisplay").innerText = time;
                setTimeout(showTime, 1000);
            }

            showTime();
        </script>
    </body>
</html>
