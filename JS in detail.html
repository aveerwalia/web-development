<html>
    <head>
        <title>
            My Magic Word Lab
        </title>

        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    </head>

    <body>

        <div class="container py-4">
            <h1 class="mb-1">
                My Magic Word Lab
            </h1>
            
            <p class="text-muted mb-4">
                Discover types, switch them, find and swap words.
            </p>
            
            <div class="card mb-4">
                <div class="card-body">
                    <h3 class="card-title"> What type is it? </h3>
                    <button class="btn btn-warning" onclick="checkTypes()">Reveal the Types!</button>
                    <div id="revealTypes"> Press the button to reveal the types!</div>
                </div>
            </div>
            </div>

            <div class="card mb-4"> 
                <div class="card-body">
                    <input id="numIn" class="form control mb-2"><br>
                    <button class="btn btn-warning" onclick="toStr()">Turn into Text!</button><br><br>
                    <button class="btn btn-warning" onclick="toNum()">Turn into Number!</button>
                </div>
            </div>
            </div>

            <script>
                var sentence="I played cricket on Wednesday.";
                function checkTypes() {
                    document.getElementById("revealTypes").innerText = "name: Alex-type " + typeof "Alex" + "age: 42-type" + typeof (42);

                }
            </script>
    </body>
</html>
