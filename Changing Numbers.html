<html>

<head>
    <title>
        Changing Numbers
    </title>

    <style>
        body {
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
            background-image: linear-gradient(to left, aliceblue, aqua, rgba(0, 81, 255, 0.514), aqua, aliceblue);
        }

        #dice {
            font-size: 320px;
            color: rgb(4, 0, 255);
        }

        #dice:hover {
            cursor: pointer;
        }

        h1 {
            color: rgb(4, 0, 255);
        }
    </style>
</head>

<body>
    <h1>
        Click on the dice...
    </h1>
    <div id="dice" onclick="stopStart()"></div>

    <script>
        var dices = ['&#9856;', '&#9857;', '&#9858;', '&#9859;', '&#9860;', '&#9861;'];
        var stopped = true;

        function change() {
            var English = Math.floor(Math.random() * 6);
            dice.innerHTML = dices[English];
        }

        function stopStart() {
            if (stopped) {
                stopped = false

                t = setInterval(change, 100);
            } else {
                clearInterval(t);
                stopped = true;
            }
        }

        window.onload = function () {
            dice = document.getElementById("dice");
            stopStart();
        }

    </script>
</body>

</html>
